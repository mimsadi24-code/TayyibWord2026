name: TayyibWord Android ARM64 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tayyibword-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build TayyibWord
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified Collabora AAR
        id: aar
        uses: actions/cache/restore@v4
        with:
          path: .engine-cache
          key: tayyibword-collabora-aar-v1

      - name: Bootstrap verified AAR
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: TayyibWord-ARM64-Collabora
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34672627454
          path: .bootstrap-collabora

      - name: Store verified AAR in cache
        if: steps.aar.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .engine-cache
          AAR="$(find .bootstrap-collabora -type f -name '*.aar' | head -n 1)"
          test -n "$AAR"
          cp "$AAR" .engine-cache/lib-debug.aar
          test -s .engine-cache/lib-debug.aar
          unzip -t .engine-cache/lib-debug.aar >/dev/null

      - name: Save verified AAR cache
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .engine-cache
          key: tayyibword-collabora-aar-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 37
        shell: bash
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip -d cmdline-tools
          rm -f cmdline-tools.zip
          rm -rf cmdline-tools/latest
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Attach Collabora engine
        shell: bash
        run: |
          set -euo pipefail

          test -s "$GITHUB_WORKSPACE/.engine-cache/lib-debug.aar"

          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"

          cp \
            "$GITHUB_WORKSPACE/.engine-cache/lib-debug.aar" \
            "$GITHUB_WORKSPACE/android/app/libs/tayyibword-engine.aar"

          unzip -t \
            "$GITHUB_WORKSPACE/android/app/libs/tayyibword-engine.aar" \
            >/dev/null

      - name: Normalize AAR compile metadata
        shell: bash
        run: |
          set -euo pipefail

          AAR="$GITHUB_WORKSPACE/android/app/libs/tayyibword-engine.aar"
          TMP="$GITHUB_WORKSPACE/.aar-normalized"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$AAR" -d "$TMP"

          META="$TMP/META-INF/com/android/build/gradle/aar-metadata.properties"
          test -f "$META"

          python3 -c '
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          out = []
          found = False

          for line in lines:
              if line.startswith("minCompileSdk="):
                  out.append("minCompileSdk=37")
                  found = True
              else:
                  out.append(line)

          if not found:
              out.append("minCompileSdk=37")

          p.write_text("\n".join(out) + "\n")
          ' "$META"

          rm -f "$AAR"

          (
            cd "$TMP"
            zip -q -r "$AAR" .
          )

          unzip -t "$AAR" >/dev/null

          unzip -p "$AAR" \
            META-INF/com/android/build/gradle/aar-metadata.properties \
            | grep -qx 'minCompileSdk=37'

          rm -rf "$TMP"

      - name: Verify Android toolchain
        shell: bash
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" version
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          ! grep -Rqs "android.aapt2FromMavenOverride=/data/data/com.termux" android

      - name: Verify project
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f android/app/build.gradle.kts
          test -f android/app/libs/tayyibword-engine.aar
          grep -q 'compileSdk = 37' android/app/build.gradle.kts
          grep -q 'minSdk = 26' android/app/build.gradle.kts

      - name: Flutter dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze

      - name: Build release APK
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TayyibWord-ARM64-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
