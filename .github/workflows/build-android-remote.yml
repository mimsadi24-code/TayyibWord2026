name: TayyibWord Android ARM64 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout TayyibWord
        uses: actions/checkout@v4

      - name: Restore stable Collabora AAR cache
        id: aar-cache
        uses: actions/cache/restore@v4
        with:
          path: .engine-cache
          key: tayyibword-collabora-aar-v1

      - name: Bootstrap AAR from last verified Collabora build
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: TayyibWord-ARM64-Collabora
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34672627454
          path: .bootstrap-collabora

      - name: Prepare and verify Collabora AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p .engine-cache

          AAR="$(find .bootstrap-collabora \
            -type f \( -name 'lib-debug.aar' -o -name '*.aar' \) \
            | head -n 1)"

          test -n "$AAR"
          cp "$AAR" .engine-cache/lib-debug.aar

          test -s .engine-cache/lib-debug.aar
          unzip -l .engine-cache/lib-debug.aar \
            | grep -E 'classes.jar|AndroidManifest.xml'

      - name: Save stable Collabora AAR cache
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .engine-cache
          key: tayyibword-collabora-aar-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          set -eux

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip -d cmdline-tools
          rm -f cmdline-tools.zip
          rm -rf cmdline-tools/latest
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Attach verified Collabora AAR
        run: |
          set -eux

          test -s "$GITHUB_WORKSPACE/.engine-cache/lib-debug.aar"

          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"

          cp \
            "$GITHUB_WORKSPACE/.engine-cache/lib-debug.aar" \
            "$GITHUB_WORKSPACE/android/app/libs/tayyibword-engine.aar"

          unzip -l \
            "$GITHUB_WORKSPACE/android/app/libs/tayyibword-engine.aar" \
            | grep -E 'classes.jar|AndroidManifest.xml'

      - name: Verify Flutter project root
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          test -f pubspec.yaml
          test -f android/app/build.gradle.kts
          test -f android/app/libs/tayyibword-engine.aar

          pwd
          ls -la

      - name: Flutter dependencies and analysis
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          flutter pub get
          flutter analyze

      - name: Build TayyibWord APK
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          flutter build apk --release

          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload TayyibWord APK
        uses: actions/upload-artifact@v4
        with:
          name: TayyibWord-ARM64-Flutter
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
