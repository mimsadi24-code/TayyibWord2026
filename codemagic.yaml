workflows:
  tayyib_word_debug:
    name: Tayyib Word Debug APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Fix Android SDK
        script: |
          python3 -c "from pathlib import Path; p=Path('android/app/build.gradle.kts'); s=p.read_text(); p.write_text(s.replace('compileSdk = 34','compileSdk = 36').replace('targetSdk = 34','targetSdk = 36'))"

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
