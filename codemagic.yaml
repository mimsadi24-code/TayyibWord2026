      - name: Fix Dart source
        script: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")

          if p.exists():
              s = p.read_text()

              # Fix missing shape/object position and rotation fields
              marker = "  String shapeKind = '';"
              if marker in s and "double objectX = 0;" not in s:
                  s = s.replace(
                      marker,
                      marker + """
          double objectX = 0;
          double objectY = 0;
          double objectRotation = 0;"""
                  )

              s = s.replace(
                  "readOnly: documentProtected,",
                  ""
              )

              s = s.replace(
                  "Icons.format_drop_cap",
                  "Icons.text_fields"
              )

              s = s.replace(
                  "onTap: insertToc",
                  "onTap: generateToc"
              )

              s = s.replace(
                  "math.min(120, math.max(5, vals[i] * 2))",
                  "math.min(120.0, math.max(5.0, vals[i] * 2.0))"
              )

              s = s.replace(
                  "math.min(120, math.max(5, vals[i-1] * 2))",
                  "math.min(120.0, math.max(5.0, vals[i-1] * 2.0))"
              )

              p.write_text(s)

          print("Dart source fixed.")
          PY
