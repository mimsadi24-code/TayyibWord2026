workflows:
tayyib_word_debug:
name: Tayyib Word Debug APK
max_build_duration: 60

environment:
  flutter: stable
  java: 17

scripts:
  - name: Fix Android SDK
    script: |
      sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle.kts
      sed -i 's/targetSdk = 34/targetSdk = 36/' android/app/build.gradle.kts

  - name: Fix Dart source
    script: |
      sed -i '/readOnly: documentProtected,/d' lib/main.dart
      sed -i "s/Icons.format_drop_cap/Icons.text_fields/g" lib/main.dart
      sed -i "s/onTap: insertToc/onTap: generateToc/g" lib/main.dart
      sed -i "s/math.min(120, math.max(5, valsi \* 2))/math.min(120.0, math.max(5.0, vals[i] * 2.0))/g" lib/main.dart
      sed -i "s/math.min(120, math.max(5, valsi-1 \* 2))/math.min(120.0, math.max(5.0, vals[i-1] * 2.0))/g" lib/main.dart

  - name: Get packages
    script: |
      flutter pub get

  - name: Build APK
    script: |
      flutter build apk --debug

artifacts:
  - build/app/outputs/flutter-apk/app-debug.apk
