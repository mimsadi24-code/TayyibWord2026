name: tayyib_word_desktop
description: TayyibWord - mobile word processor
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: 10.3.8
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  pdf: ^3.13.0
  printing: ^5.15.0
  archive: ^4.0.9
  flutter_quill: ^11.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tayyib_word_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/tayyib_word_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/tayyib_word_logo.png
